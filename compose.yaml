# PostgreSQL + the desk. The demo profile seeds synthetic data; remove it for an empty database.
services:
  db:
    image: postgres:17
    environment: { POSTGRES_DB: broker, POSTGRES_USER: broker, POSTGRES_PASSWORD: broker }
    ports: ["5432:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U broker -d broker"], interval: 3s, timeout: 3s, retries: 20 }
  desk:
    build: .
    depends_on: { db: { condition: service_healthy } }
    environment:
      DB_URL: jdbc:postgresql://db:5432/broker
      DB_USER: broker
      DB_PASSWORD: broker
      SPRING_PROFILES_ACTIVE: demo
    ports: ["8080:8080"]
