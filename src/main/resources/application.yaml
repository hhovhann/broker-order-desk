spring:
  application.name: broker-order-desk
  threads.virtual.enabled: true
  datasource:
    url: ${DB_URL:jdbc:h2:mem:broker-${random.uuid};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=15000}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate.ddl-auto: validate          # Flyway owns the schema; Hibernate only checks it matches
    open-in-view: false
  flyway.enabled: true
server.port: ${PORT:8080}
management:
  endpoints.web.exposure.include: health,info
  endpoint.health.probes.enabled: true    # /actuator/health/liveness and /readiness for Kubernetes
broker:
  band-percent: 10                         # daily price band around the reference price
  max-order-value-mills: 5000000000        # 5,000,000 QAR
  maintenance-margin-percent: 35
  demo-password: ${BROKER_DEMO_PASSWORD:demo-pass}   # synthetic; real deployments use the bank IdP
